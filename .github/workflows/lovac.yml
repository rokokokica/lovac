name: Lovac na greške

on:
  schedule:
    - cron: "23 6 * * *"   # svaki dan oko 7:23 po zagrebačkom vremenu (zimi), 8:23 ljeti
  workflow_dispatch:        # gumb "Run workflow" za ručno pokretanje

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lovac
  cancel-in-progress: false

jobs:
  lov:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Skini crawlere (cijene-api)
        run: git clone --depth 1 https://github.com/senko/cijene-api.git crawler-projekt

      - name: Vrati povijest cijena
        uses: actions/cache/restore@v4
        with:
          path: crawler-projekt/lovac_cijene.sqlite
          key: lovac-povijest-${{ github.run_id }}
          restore-keys: lovac-povijest-

      - name: Pokreni lovca
        working-directory: crawler-projekt
        env:
          PYTHONUTF8: "1"
        run: |
          cat > lovac.py <<'LOVAC_EOF'
          """
          Lovac na greške u cijenama (hrana)
          ==================================

          Skida službene dnevne cjenike trgovačkih lanaca (obveza po NN 75/2025 i
          NN 101/2026), sprema ih u lokalnu bazu i traži sumnjivo niske cijene.

          Koristi crawlere iz otvorenog projekta cijene-api (github.com/senko/cijene-api),
          pa ova datoteka mora stajati u mapi tog projekta.

          Pokretanje (iz mape cijene-api):
              uv run lovac.py                 # Kaufland + Plodine, poslovnice u Zagrebu
              uv run lovac.py -c kaufland,plodine,konzum,spar
              uv run lovac.py --grad ""       # sve poslovnice u Hrvatskoj (sporije)
              uv run lovac.py --prag 40       # strože: samo padovi od 40% i više

          Na kraju se u pregledniku otvori izvještaj (izvjestaj.html).

          Što se smatra sumnjivim (svaki signal ima svoj razlog u izvještaju):
            1. POSLOVNICA  - u jednoj poslovnici cijena je drastično niža nego u ostalima
                             istog lanca isti dan (klasična greška pri unosu)
            2. POVIJEST    - cijena je pala jako ispod uobičajene (medijan zadnjih dana);
                             radi od drugog pokretanja, jer treba povijest
            3. SIDRENA     - cijena je drastično niža od sidrene cijene (2. 5. 2025.)
            4. 30 DANA     - cijena je drastično niža od najniže cijene u zadnjih 30 dana
          """

          from __future__ import annotations

          import argparse
          import datetime as dt
          import html
          import logging
          import sqlite3
          import statistics
          import sys
          import unicodedata
          import webbrowser
          from dataclasses import dataclass
          from decimal import Decimal
          from pathlib import Path

          MAPA = Path(__file__).resolve().parent
          BAZA = MAPA / "lovac_cijene.sqlite"
          IZVJESTAJ = MAPA / "izvjestaj.html"

          ZADANI_LANCI = ["kaufland", "plodine"]
          ZADANI_GRAD = "Zagreb"
          ZADANI_PRAG = 50  # postotak pada koji se smatra sumnjivim
          MIN_CIJENA = Decimal("1.00")  # ispod ovoga ne gledamo (žvake, vrećice...)
          DANI_POVIJESTI = 30

          log = logging.getLogger("lovac")


          # --------------------------------------------------------------------------
          # Pomoćne funkcije
          # --------------------------------------------------------------------------

          def bez_kvacica(tekst: str) -> str:
              tekst = (tekst or "").replace("đ", "d").replace("Đ", "D")
              return "".join(
                  c for c in unicodedata.normalize("NFKD", tekst) if not unicodedata.combining(c)
              ).lower()


          def trenutna_cijena(p) -> Decimal | None:
              """Cijena koju kupac stvarno plaća: akcijska ako postoji, inače redovna."""
              kandidati = [c for c in (p.special_price, p.price) if c and c > 0]
              return min(kandidati) if kandidati else None


          def pad_posto(nova: Decimal, stara: Decimal) -> float:
              return float((stara - nova) / stara * 100) if stara else 0.0


          # --------------------------------------------------------------------------
          # Baza
          # --------------------------------------------------------------------------

          def otvori_bazu(putanja: Path | None = None) -> sqlite3.Connection:
              db = sqlite3.connect(putanja or BAZA)
              db.execute(
                  """
                  CREATE TABLE IF NOT EXISTS cijene (
                      datum TEXT, lanac TEXT, sifra TEXT, naziv TEXT, marka TEXT,
                      kolicina TEXT, cijena REAL, medijan_lanca REAL,
                      PRIMARY KEY (datum, lanac, sifra)
                  )
                  """
              )
              return db


          def spremi_dan(db, datum: dt.date, lanac: str, artikli: dict) -> None:
              db.executemany(
                  "INSERT OR REPLACE INTO cijene VALUES (?,?,?,?,?,?,?,?)",
                  [
                      (
                          datum.isoformat(), lanac, sifra, a.naziv, a.marka, a.kolicina,
                          float(a.najniza), float(a.medijan),
                      )
                      for sifra, a in artikli.items()
                  ],
              )
              # Čuvamo samo koliko treba za usporedbu, da baza ne raste unedogled
              granica = (datum - dt.timedelta(days=DANI_POVIJESTI + 5)).isoformat()
              db.execute("DELETE FROM cijene WHERE datum < ?", (granica,))
              db.commit()


          def uobicajena_cijena(db, datum: dt.date, lanac: str, sifra: str) -> float | None:
              """Medijan dnevnih medijana prije današnjeg dana."""
              od = (datum - dt.timedelta(days=DANI_POVIJESTI)).isoformat()
              redovi = db.execute(
                  "SELECT medijan_lanca FROM cijene WHERE lanac=? AND sifra=? AND datum>=? AND datum<?",
                  (lanac, sifra, od, datum.isoformat()),
              ).fetchall()
              vrijednosti = [r[0] for r in redovi if r[0]]
              return statistics.median(vrijednosti) if vrijednosti else None


          # --------------------------------------------------------------------------
          # Prikupljanje
          # --------------------------------------------------------------------------

          @dataclass
          class Artikl:
              naziv: str
              marka: str
              kolicina: str
              najniza: Decimal
              poslovnica: str
              medijan: Decimal
              broj_poslovnica: int
              sidrena: Decimal | None
              najniza_30: Decimal | None


          def prikupi(lanac: str, datum: dt.date, grad: str) -> list:
              """Vrati listu poslovnica (Store) za lanac, filtrirano po gradu."""
              from crawler.crawl import CRAWLERS  # iz projekta cijene-api

              crawler = CRAWLERS[lanac]()
              poslovnice = crawler.get_all_products(datum)
              if grad:
                  g = bez_kvacica(grad)
                  poslovnice = [
                      s for s in poslovnice
                      if g in bez_kvacica(s.city) or g in bez_kvacica(s.street_address)
                  ]
              return poslovnice


          def sazmi(poslovnice: list) -> dict[str, Artikl]:
              """Za svaki artikl: najniža cijena, gdje je, i medijan preko poslovnica."""
              po_sifri: dict[str, list] = {}
              for s in poslovnice:
                  for p in s.items:
                      if p.available is False:
                          continue
                      c = trenutna_cijena(p)
                      if c is None:
                          continue
                      po_sifri.setdefault(p.product_id, []).append((c, s, p))

              rezultat = {}
              for sifra, unosi in po_sifri.items():
                  unosi.sort(key=lambda x: x[0])
                  c, s, p = unosi[0]
                  rezultat[sifra] = Artikl(
                      naziv=p.product,
                      marka=p.brand or "",
                      kolicina=p.quantity or "",
                      najniza=c,
                      poslovnica=f"{s.name}, {s.street_address}".strip(", "),
                      medijan=Decimal(str(statistics.median([u[0] for u in unosi]))),
                      broj_poslovnica=len(unosi),
                      sidrena=p.anchor_price,
                      najniza_30=p.best_price_30,
                  )
              return rezultat


          # --------------------------------------------------------------------------
          # Detekcija
          # --------------------------------------------------------------------------

          @dataclass
          class Nalaz:
              lanac: str
              artikl: Artikl
              usporedna: Decimal
              pad: float
              razlog: str


          def pronadi_sumnjive(db, datum, lanac, artikli: dict, prag: float) -> list[Nalaz]:
              nalazi = []
              for sifra, a in artikli.items():
                  signali = []

                  if a.broj_poslovnica >= 3 and a.medijan >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.medijan)
                      if pad >= prag:
                          signali.append((pad, a.medijan,
                                          f"POSLOVNICA: u {a.broj_poslovnica} poslovnica obično {a.medijan:.2f} €"))

                  uob = uobicajena_cijena(db, datum, lanac, sifra)
                  if uob and uob >= float(MIN_CIJENA):
                      uob_d = Decimal(str(round(uob, 2)))
                      pad = pad_posto(a.najniza, uob_d)
                      if pad >= prag:
                          signali.append((pad, uob_d, f"POVIJEST: uobičajeno {uob_d:.2f} €"))

                  if a.sidrena and a.sidrena >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.sidrena)
                      if pad >= prag:
                          signali.append((pad, a.sidrena, f"SIDRENA: sidrena cijena {a.sidrena:.2f} €"))

                  if a.najniza_30 and a.najniza_30 >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.najniza_30)
                      if pad >= prag:
                          signali.append((pad, a.najniza_30, f"30 DANA: najniža u 30 dana {a.najniza_30:.2f} €"))

                  if signali:
                      signali.sort(key=lambda x: -x[0])
                      pad, usporedna, _ = signali[0]
                      razlog = " · ".join(s[2] for s in signali)
                      nalazi.append(Nalaz(lanac, a, usporedna, pad, razlog))
              return nalazi


          # --------------------------------------------------------------------------
          # Izvještaj
          # --------------------------------------------------------------------------

          def napravi_izvjestaj(nalazi: list[Nalaz], datum, statusi: dict, putanja: Path | None = None):
              putanja = putanja or IZVJESTAJ
              nalazi = sorted(nalazi, key=lambda n: -n.pad)
              e = html.escape
              redovi = "\n".join(
                  f"""<tr>
                    <td class="pad">−{n.pad:.0f}%</td>
                    <td><b>{e(n.artikl.naziv)}</b><br><span class="sitno">{e(n.artikl.marka)} {e(n.artikl.kolicina)}</span></td>
                    <td>{e(n.lanac.title())}<br><span class="sitno">{e(n.artikl.poslovnica)}</span></td>
                    <td class="cijena">{n.artikl.najniza:.2f} €</td>
                    <td class="stara">{n.usporedna:.2f} €</td>
                    <td class="sitno">{e(n.razlog)}</td>
                  </tr>"""
                  for n in nalazi
              )
              status_html = " · ".join(f"{e(k.title())}: {e(v)}" for k, v in statusi.items())
              prazno = "" if nalazi else '<p class="prazno">Danas nema sumnjivih cijena. Probaj sutra ili spusti prag.</p>'

              sadrzaj = f"""<!doctype html>
          <html lang="hr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Lovac na greške</title>
          <style>
            :root {{ --bg:#fbfaf7; --tx:#1d1d1b; --mut:#6b6b66; --line:#e6e3dc; --hot:#c2410c; }}
            @media (prefers-color-scheme: dark) {{ :root {{ --bg:#16161a; --tx:#ecebe8; --mut:#9a9a94; --line:#2c2c31; --hot:#fb923c; }} }}
            body {{ background:var(--bg); color:var(--tx); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; margin:0; padding:24px 16px; }}
            main {{ max-width:1100px; margin:0 auto; }}
            h1 {{ font-size:26px; margin:0 0 4px; }}
            .meta {{ color:var(--mut); margin-bottom:20px; }}
            table {{ width:100%; border-collapse:collapse; }}
            th, td {{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }}
            th {{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }}
            .pad {{ color:var(--hot); font-weight:700; font-size:18px; white-space:nowrap; }}
            .cijena {{ font-weight:700; white-space:nowrap; }}
            .stara {{ color:var(--mut); text-decoration:line-through; white-space:nowrap; }}
            .sitno {{ color:var(--mut); font-size:13px; }}
            .prazno {{ padding:40px 0; color:var(--mut); }}
            .wrap {{ overflow-x:auto; }}
          </style></head><body><main>
          <h1>Lovac na greške</h1>
          <div class="meta">{datum:%d. %m. %Y.} · {len(nalazi)} sumnjivih cijena · {status_html}</div>
          {prazno}
          <div class="wrap"><table>
          <thead><tr><th>Pad</th><th>Artikl</th><th>Gdje</th><th>Sada</th><th>Inače</th><th>Zašto je sumnjivo</th></tr></thead>
          <tbody>{redovi}</tbody></table></div>
          <p class="sitno">Prije puta u dućan provjeri cijenu na polici: neki "padovi" su samo krivo objavljen cjenik ili artikl koji je nestao s police.</p>
          </main></body></html>"""
              putanja.write_text(sadrzaj, encoding="utf-8")
              return putanja


          # --------------------------------------------------------------------------
          # Glavni program
          # --------------------------------------------------------------------------

          def main(argv=None):
              ap = argparse.ArgumentParser(description="Lovac na greške u cijenama hrane")
              ap.add_argument("-c", "--lanci", default=",".join(ZADANI_LANCI),
                              help="lanci odvojeni zarezom (npr. kaufland,plodine,konzum,spar)")
              ap.add_argument("--grad", default=ZADANI_GRAD,
                              help='samo poslovnice u ovom gradu; "" za cijelu Hrvatsku')
              ap.add_argument("--prag", type=float, default=ZADANI_PRAG,
                              help="postotak pada koji je sumnjiv (zadano 50)")
              ap.add_argument("-d", "--datum", default=None, help="datum YYYY-MM-DD (zadano danas)")
              ap.add_argument("--ne-otvaraj", action="store_true", help="ne otvaraj izvještaj u pregledniku")
              args = ap.parse_args(argv)

              logging.basicConfig(level=logging.WARNING, format="%(message)s")
              datum = dt.date.fromisoformat(args.datum) if args.datum else dt.date.today()
              lanci = [l.strip().lower() for l in args.lanci.split(",") if l.strip()]

              db = otvori_bazu()
              svi_nalazi, statusi = [], {}

              for lanac in lanci:
                  print(f"→ {lanac.title()}: skidam cjenike...", flush=True)
                  try:
                      poslovnice = prikupi(lanac, datum, args.grad)
                  except Exception as err:  # mreža, promjena formata, nema cjenika za danas
                      print(f"  ✗ nije uspjelo: {err}")
                      statusi[lanac] = "nije uspjelo"
                      continue
                  if not poslovnice:
                      print("  ✗ nema poslovnica (krivi grad ili cjenik još nije objavljen)")
                      statusi[lanac] = "nema podataka"
                      continue

                  artikli = sazmi(poslovnice)
                  nalazi = pronadi_sumnjive(db, datum, lanac, artikli, args.prag)
                  spremi_dan(db, datum, lanac, artikli)
                  svi_nalazi += nalazi
                  statusi[lanac] = f"{len(poslovnice)} poslovnica, {len(artikli)} artikala"
                  print(f"  ✓ {len(poslovnice)} poslovnica, {len(artikli)} artikala, {len(nalazi)} sumnjivih")

              putanja = napravi_izvjestaj(svi_nalazi, datum, statusi)
              print(f"\nIzvještaj: {putanja}")
              if not args.ne_otvaraj:
                  webbrowser.open(putanja.as_uri())


          if __name__ == "__main__":
              sys.exit(main())
          LOVAC_EOF
          uv sync
          uv run lovac.py --ne-otvaraj -c kaufland,plodine
          mkdir -p ../stranica
          cp izvjestaj.html ../stranica/index.html

      - name: Spremi povijest cijena
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crawler-projekt/lovac_cijene.sqlite
          key: lovac-povijest-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stranica

      - id: objava
        uses: actions/deploy-pages@v4
