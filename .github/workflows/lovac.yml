name: Lovac na greške

on:
  schedule:
    - cron: "23 6 * * *"   # svaki dan oko 7:23 po zagrebačkom vremenu (zimi), 8:23 ljeti
  workflow_dispatch:        # gumb "Run workflow" za ručno pokretanje

permissions:
  contents: read
  pages: write
  id-token: write

# ===== POSTAVKE: ovo slobodno mijenjaj =====
env:
  LANCI: "kaufland,plodine"   # npr. "kaufland,plodine,konzum,spar,lidl"
  GRAD: "Zagreb"              # "" za cijelu Hrvatsku
  PRAG: "50"                  # postotak pada koji je sumnjiv
  SAMO: ""                    # npr. "kava,meso,protein"; prazno = sve
# ===========================================

concurrency:
  group: lovac
  cancel-in-progress: false

jobs:
  lov:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Skini crawlere (cijene-api)
        run: git clone --depth 1 https://github.com/senko/cijene-api.git crawler-projekt

      - name: Vrati povijest cijena
        uses: actions/cache/restore@v4
        with:
          path: crawler-projekt/lovac_cijene.sqlite
          key: lovac-povijest-${{ github.run_id }}
          restore-keys: lovac-povijest-

      - name: Pokreni lovca
        working-directory: crawler-projekt
        env:
          PYTHONUTF8: "1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          STRANICA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          cat > lovac.py <<'LOVAC_EOF'
          """
          Lovac na greške u cijenama (hrana)
          ==================================

          Skida službene dnevne cjenike trgovačkih lanaca (obveza po NN 75/2025 i
          NN 101/2026), sprema ih u lokalnu bazu i traži sumnjivo niske cijene.
          Koristi crawlere iz otvorenog projekta cijene-api (github.com/senko/cijene-api).

          Opcije:
              -c / --lanci   kaufland,plodine,konzum,spar,lidl ...
              --grad         Zagreb (zadano), Split ..., "" za cijelu Hrvatsku
              --prag         postotak pada koji je sumnjiv (zadano 50)
              --samo         samo artikli koji sadrže neku od riječi, npr. "kava,meso,protein"

          Telegram obavijest (nije obavezno): postavi varijable okruženja
          TELEGRAM_TOKEN i TELEGRAM_CHAT. Ako je postavljen STRANICA_URL, poruka
          sadrži i link na izvještaj.

          Signali sumnjive cijene:
            POSLOVNICA - u jednoj poslovnici drastično niža nego u ostalima istog lanca
            POVIJEST   - drastično ispod uobičajene cijene (radi od drugog dana)
            SIDRENA    - drastično ispod sidrene cijene (2. 5. 2025.)
            30 DANA    - drastično ispod najniže cijene u zadnjih 30 dana
          """

          from __future__ import annotations

          import argparse
          import datetime as dt
          import html
          import json
          import logging
          import os
          import sqlite3
          import statistics
          import sys
          import unicodedata
          import urllib.parse
          import urllib.request
          import webbrowser
          from dataclasses import dataclass
          from decimal import Decimal
          from pathlib import Path

          MAPA = Path(__file__).resolve().parent
          BAZA = MAPA / "lovac_cijene.sqlite"
          IZVJESTAJ = MAPA / "izvjestaj.html"

          ZADANI_LANCI = "kaufland,plodine"
          ZADANI_GRAD = "Zagreb"
          ZADANI_PRAG = 50
          MIN_CIJENA = Decimal("1.00")  # ispod ovoga ne gledamo
          DANI_POVIJESTI = 30
          DANI_NALAZA = 7  # koliko dana unatrag prikazati stare nalaze
          MAX_RASPRODAJA = 40  # koliko rasprodaja prikazati

          log = logging.getLogger("lovac")


          # --------------------------------------------------------------------------
          # Pomoćne funkcije
          # --------------------------------------------------------------------------

          def bez_kvacica(tekst: str) -> str:
              tekst = (tekst or "").replace("đ", "d").replace("Đ", "D")
              return "".join(
                  c for c in unicodedata.normalize("NFKD", tekst) if not unicodedata.combining(c)
              ).lower()


          def trenutna_cijena(p) -> Decimal | None:
              """Cijena koju kupac stvarno plaća: akcijska ako postoji, inače redovna."""
              kandidati = [c for c in (p.special_price, p.price) if c and c > 0]
              return min(kandidati) if kandidati else None


          def pad_posto(nova: Decimal, stara: Decimal) -> float:
              return float((stara - nova) / stara * 100) if stara else 0.0


          def odgovara_filtru(tekst: str, rijeci: list[str]) -> bool:
              if not rijeci:
                  return True
              t = bez_kvacica(tekst)
              return any(r in t for r in rijeci)


          # --------------------------------------------------------------------------
          # Baza
          # --------------------------------------------------------------------------

          def otvori_bazu(putanja: Path | None = None) -> sqlite3.Connection:
              db = sqlite3.connect(putanja or BAZA)
              db.execute(
                  """
                  CREATE TABLE IF NOT EXISTS cijene (
                      datum TEXT, lanac TEXT, sifra TEXT, naziv TEXT, marka TEXT,
                      kolicina TEXT, cijena REAL, medijan_lanca REAL,
                      PRIMARY KEY (datum, lanac, sifra)
                  )
                  """
              )
              db.execute(
                  """
                  CREATE TABLE IF NOT EXISTS nalazi (
                      datum TEXT, lanac TEXT, sifra TEXT, naziv TEXT, marka TEXT,
                      kolicina TEXT, poslovnica TEXT, cijena REAL, usporedna REAL,
                      pad REAL, razlog TEXT,
                      PRIMARY KEY (datum, lanac, sifra)
                  )
                  """
              )
              return db


          def spremi_dan(db, datum: dt.date, lanac: str, artikli: dict) -> None:
              db.executemany(
                  "INSERT OR REPLACE INTO cijene VALUES (?,?,?,?,?,?,?,?)",
                  [
                      (datum.isoformat(), lanac, sifra, a.naziv, a.marka, a.kolicina,
                       float(a.najniza), float(a.medijan))
                      for sifra, a in artikli.items()
                  ],
              )
              granica = (datum - dt.timedelta(days=DANI_POVIJESTI + 5)).isoformat()
              db.execute("DELETE FROM cijene WHERE datum < ?", (granica,))
              db.commit()


          def spremi_nalaze(db, datum: dt.date, lanac: str, nalazi: list) -> None:
              db.execute("DELETE FROM nalazi WHERE datum=? AND lanac=?", (datum.isoformat(), lanac))
              db.executemany(
                  "INSERT OR REPLACE INTO nalazi VALUES (?,?,?,?,?,?,?,?,?,?,?)",
                  [
                      (datum.isoformat(), n.lanac, n.sifra, n.artikl.naziv, n.artikl.marka,
                       n.artikl.kolicina, n.artikl.poslovnica, float(n.artikl.najniza),
                       float(n.usporedna), n.pad, n.razlog)
                      for n in nalazi if n.jaki
                  ],
              )
              granica = (datum - dt.timedelta(days=DANI_POVIJESTI + 5)).isoformat()
              db.execute("DELETE FROM nalazi WHERE datum < ?", (granica,))
              db.commit()


          def uobicajena_cijena(db, datum: dt.date, lanac: str, sifra: str) -> float | None:
              od = (datum - dt.timedelta(days=DANI_POVIJESTI)).isoformat()
              redovi = db.execute(
                  "SELECT medijan_lanca FROM cijene WHERE lanac=? AND sifra=? AND datum>=? AND datum<?",
                  (lanac, sifra, od, datum.isoformat()),
              ).fetchall()
              vrijednosti = [r[0] for r in redovi if r[0]]
              return statistics.median(vrijednosti) if vrijednosti else None


          def povijest_artikla(db, datum: dt.date, lanac: str, sifra: str) -> list[tuple[str, float]]:
              od = (datum - dt.timedelta(days=DANI_POVIJESTI)).isoformat()
              return db.execute(
                  "SELECT datum, cijena FROM cijene WHERE lanac=? AND sifra=? AND datum>=? AND datum<=? ORDER BY datum",
                  (lanac, sifra, od, datum.isoformat()),
              ).fetchall()


          def stari_nalazi(db, datum: dt.date) -> list[tuple]:
              od = (datum - dt.timedelta(days=DANI_NALAZA)).isoformat()
              return db.execute(
                  "SELECT datum, lanac, naziv, marka, kolicina, poslovnica, cijena, usporedna, pad "
                  "FROM nalazi WHERE datum>=? AND datum<? ORDER BY datum DESC, pad DESC",
                  (od, datum.isoformat()),
              ).fetchall()


          # --------------------------------------------------------------------------
          # Prikupljanje
          # --------------------------------------------------------------------------

          @dataclass
          class Artikl:
              naziv: str
              marka: str
              kolicina: str
              kategorija: str
              najniza: Decimal
              poslovnica: str
              medijan: Decimal
              broj_poslovnica: int
              sidrena: Decimal | None
              najniza_30: Decimal | None
              redovna: Decimal | None = None
              akcijska: Decimal | None = None


          def prikupi(lanac: str, datum: dt.date, grad: str) -> list:
              """Vrati listu poslovnica (Store) za lanac, filtrirano po gradu."""
              from crawler.crawl import CRAWLERS  # iz projekta cijene-api

              poslovnice = CRAWLERS[lanac]().get_all_products(datum)
              if grad:
                  g = bez_kvacica(grad)
                  poslovnice = [
                      s for s in poslovnice
                      if g in bez_kvacica(s.city) or g in bez_kvacica(s.street_address)
                  ]
              return poslovnice


          def sazmi(poslovnice: list) -> dict[str, Artikl]:
              po_sifri: dict[str, list] = {}
              for s in poslovnice:
                  for p in s.items:
                      if p.available is False:
                          continue
                      c = trenutna_cijena(p)
                      if c is None:
                          continue
                      po_sifri.setdefault(p.product_id, []).append((c, s, p))

              rezultat = {}
              for sifra, unosi in po_sifri.items():
                  unosi.sort(key=lambda x: x[0])
                  c, s, p = unosi[0]
                  rezultat[sifra] = Artikl(
                      naziv=p.product,
                      marka=p.brand or "",
                      kolicina=p.quantity or "",
                      kategorija=p.category or "",
                      najniza=c,
                      poslovnica=f"{s.name}, {s.street_address}".strip(", "),
                      medijan=Decimal(str(statistics.median([u[0] for u in unosi]))),
                      broj_poslovnica=len(unosi),
                      sidrena=p.anchor_price,
                      najniza_30=p.best_price_30,
                      redovna=p.price,
                      akcijska=p.special_price,
                  )
              return rezultat


          # --------------------------------------------------------------------------
          # Detekcija
          # --------------------------------------------------------------------------

          @dataclass
          class Nalaz:
              lanac: str
              sifra: str
              artikl: Artikl
              usporedna: Decimal
              pad: float
              razlog: str
              jaki: bool = True  # False = samo ispod sidrene cijene (vjerojatno rasprodaja)


          def pronadi_sumnjive(db, datum, lanac, artikli: dict, prag: float,
                               rijeci: list[str] | None = None) -> list[Nalaz]:
              nalazi = []
              for sifra, a in artikli.items():
                  if not odgovara_filtru(f"{a.naziv} {a.marka} {a.kategorija}", rijeci or []):
                      continue
                  signali = []

                  if a.broj_poslovnica >= 3 and a.medijan >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.medijan)
                      if pad >= prag:
                          signali.append((pad, a.medijan,
                                          f"POSLOVNICA: u {a.broj_poslovnica} poslovnica obično {a.medijan:.2f} €"))

                  uob = uobicajena_cijena(db, datum, lanac, sifra)
                  if uob and uob >= float(MIN_CIJENA):
                      uob_d = Decimal(str(round(uob, 2)))
                      pad = pad_posto(a.najniza, uob_d)
                      if pad >= prag:
                          signali.append((pad, uob_d, f"POVIJEST: uobičajeno {uob_d:.2f} €"))

                  if a.sidrena and a.sidrena >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.sidrena)
                      if pad >= prag:
                          signali.append((pad, a.sidrena, f"SIDRENA: sidrena cijena {a.sidrena:.2f} €"))

                  if a.najniza_30 and a.najniza_30 >= MIN_CIJENA:
                      pad = pad_posto(a.najniza, a.najniza_30)
                      if pad >= prag:
                          signali.append((pad, a.najniza_30, f"30 DANA: najniža u 30 dana {a.najniza_30:.2f} €"))

                  if signali:
                      signali.sort(key=lambda x: -x[0])
                      pad, usporedna, _ = signali[0]
                      # Greška = jeftinije nego u drugim poslovnicama ili nagli pad u odnosu na povijest.
                      # Pad ispod najniže cijene u 30 dana računa se kao greška samo ako nije službena akcija.
                      jaki = any(
                          s[2].startswith(("POSLOVNICA", "POVIJEST"))
                          or (s[2].startswith("30 DANA") and not a.akcijska)
                          for s in signali
                      )
                      nalazi.append(Nalaz(lanac, sifra, a, usporedna, pad,
                                          " · ".join(s[2] for s in signali), jaki))
              return nalazi


          # --------------------------------------------------------------------------
          # Izvještaj
          # --------------------------------------------------------------------------

          def graf(tocke: list[tuple[str, float]], usporedna: float) -> str:
              """Mali SVG graf cijene kroz zadnjih 30 dana."""
              if len(tocke) < 2:
                  return '<span class="sitno">graf od 2. dana</span>'
              s, v = 120, 34
              cijene = [c for _, c in tocke] + [usporedna]
              lo, hi = min(cijene), max(cijene)
              raspon = (hi - lo) or 1
              n = len(tocke) - 1
              xy = [(i / n * (s - 4) + 2, v - 2 - (c - lo) / raspon * (v - 4)) for i, (_, c) in enumerate(tocke)]
              linija = " ".join(f"{x:.1f},{y:.1f}" for x, y in xy)
              zx, zy = xy[-1]
              return (f'<svg class="graf" viewBox="0 0 {s} {v}" width="{s}" height="{v}" role="img" '
                      f'aria-label="Cijena zadnjih {len(tocke)} dana">'
                      f'<polyline points="{linija}" fill="none" stroke="var(--mut)" stroke-width="1.5"/>'
                      f'<circle cx="{zx:.1f}" cy="{zy:.1f}" r="3" fill="var(--hot)"/></svg>')


          def napravi_izvjestaj(db, nalazi: list[Nalaz], datum, statusi: dict, prag, rijeci,
                                putanja: Path | None = None):
              putanja = putanja or IZVJESTAJ
              rasprodaje = sorted([n for n in nalazi if not n.jaki], key=lambda n: -n.pad)
              nalazi = sorted([n for n in nalazi if n.jaki], key=lambda n: -n.pad)
              e = html.escape

              redovi = "\n".join(
                  f"""<tr>
                    <td class="pad">−{n.pad:.0f}%</td>
                    <td><b>{e(n.artikl.naziv)}</b><br><span class="sitno">{e(n.artikl.marka)} {e(n.artikl.kolicina)}</span></td>
                    <td>{e(n.lanac.title())}<br><span class="sitno">{e(n.artikl.poslovnica)}</span></td>
                    <td class="cijena">{n.artikl.najniza:.2f} €<br><span class="stara">{n.usporedna:.2f} €</span></td>
                    <td>{graf(povijest_artikla(db, datum, n.lanac, n.sifra), float(n.usporedna))}</td>
                    <td class="sitno">{e(n.razlog)}</td>
                  </tr>"""
                  for n in nalazi
              )

              ras_redovi = "\n".join(
                  f"""<tr>
                    <td class="pad mali">−{n.pad:.0f}%</td>
                    <td><b>{e(n.artikl.naziv)}</b><br><span class="sitno">{e(n.artikl.marka)} {e(n.artikl.kolicina)}</span></td>
                    <td>{e(n.lanac.title())}<br><span class="sitno">{e(n.artikl.poslovnica)}</span></td>
                    <td class="cijena">{n.artikl.najniza:.2f} €<br><span class="stara">{n.usporedna:.2f} €</span></td>
                  </tr>"""
                  for n in rasprodaje[:MAX_RASPRODAJA]
              )
              ras_html = (
                  f"""<details><summary><h2>Rasprodaje i velike akcije ({len(rasprodaje)})</h2></summary>
          <p class="sitno">Artikli daleko ispod sidrene cijene iz svibnja 2025. ili službene akcije s ogromnim popustom. To nisu greške,
          ali znaju biti jako isplative. Prikazano je {min(len(rasprodaje), MAX_RASPRODAJA)} najvećih.</p>
          <div class="wrap"><table>
          <thead><tr><th>Pad</th><th>Artikl</th><th>Gdje</th><th>Sada / inače</th></tr></thead>
          <tbody>{ras_redovi}</tbody></table></div></details>"""
                  if rasprodaje else ""
              )

              stari = stari_nalazi(db, datum)
              stari_redovi = "\n".join(
                  f"""<tr>
                    <td class="sitno">{dt.date.fromisoformat(d):%d. %m.}</td>
                    <td class="pad mali">−{pad:.0f}%</td>
                    <td><b>{e(naz)}</b><br><span class="sitno">{e(mar)} {e(kol)}</span></td>
                    <td>{e(lan.title())}<br><span class="sitno">{e(posl)}</span></td>
                    <td class="cijena">{c:.2f} €<br><span class="stara">{u:.2f} €</span></td>
                  </tr>"""
                  for d, lan, naz, mar, kol, posl, c, u, pad in stari
              )
              stari_html = (
                  f"""<h2>Prethodnih {DANI_NALAZA} dana</h2>
          <div class="wrap"><table>
          <thead><tr><th>Dan</th><th>Pad</th><th>Artikl</th><th>Gdje</th><th>Cijena</th></tr></thead>
          <tbody>{stari_redovi}</tbody></table></div>"""
                  if stari else ""
              )

              status_html = " · ".join(f"{e(k.title())}: {e(v)}" for k, v in statusi.items())
              filtar = f" · samo: {e(', '.join(rijeci))}" if rijeci else ""
              prazno = "" if nalazi else '<p class="prazno">Danas nema mogućih grešaka u cijenama.</p>'
              tablica = (
                  f"""<div class="wrap"><table>
          <thead><tr><th>Pad</th><th>Artikl</th><th>Gdje</th><th>Sada / inače</th><th>30 dana</th><th>Zašto je sumnjivo</th></tr></thead>
          <tbody>{redovi}</tbody></table></div>"""
                  if nalazi else ""
              )

              sadrzaj = f"""<!doctype html>
          <html lang="hr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Lovac na greške</title>
          <style>
            :root {{ --bg:#fbfaf7; --tx:#1d1d1b; --mut:#6b6b66; --line:#e6e3dc; --hot:#c2410c; }}
            @media (prefers-color-scheme: dark) {{ :root {{ --bg:#16161a; --tx:#ecebe8; --mut:#9a9a94; --line:#2c2c31; --hot:#fb923c; }} }}
            body {{ background:var(--bg); color:var(--tx); font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif; margin:0; padding:24px 16px; }}
            main {{ max-width:1100px; margin:0 auto; }}
            h1 {{ font-size:26px; margin:0 0 4px; }}
            h2 {{ font-size:18px; margin:36px 0 8px; }}
            .meta {{ color:var(--mut); margin-bottom:20px; }}
            table {{ width:100%; border-collapse:collapse; }}
            th, td {{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }}
            th {{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mut); }}
            .pad {{ color:var(--hot); font-weight:700; font-size:18px; white-space:nowrap; }}
            .pad.mali {{ font-size:15px; }}
            .cijena {{ font-weight:700; white-space:nowrap; }}
            .stara {{ color:var(--mut); font-weight:400; text-decoration:line-through; }}
            .sitno {{ color:var(--mut); font-size:13px; }}
            .prazno {{ padding:24px 0; color:var(--mut); }}
            .wrap {{ overflow-x:auto; }}
            .graf {{ display:block; }}
            details {{ margin-top:36px; }}
            summary {{ cursor:pointer; color:var(--mut); }}
            summary h2 {{ display:inline; margin:0; color:var(--tx); }}
          </style></head><body><main>
          <h1>Lovac na greške</h1>
          <div class="meta">{datum:%d. %m. %Y.} · {len(nalazi)} mogućih grešaka · {len(rasprodaje)} rasprodaja i akcija · prag {prag:.0f}%{filtar}<br>{status_html}</div>
          {prazno}
          {tablica}
          {stari_html}
          {ras_html}
          <p class="sitno" style="margin-top:28px">Prije puta u dućan provjeri cijenu na polici: neki "padovi" su krivo objavljen cjenik ili artikl koji nije na polici.</p>
          </main></body></html>"""
              putanja.write_text(sadrzaj, encoding="utf-8")
              return putanja


          # --------------------------------------------------------------------------
          # Telegram
          # --------------------------------------------------------------------------

          def posalji_telegram(nalazi: list[Nalaz], datum) -> None:
              token = os.environ.get("TELEGRAM_TOKEN", "").strip()
              chat = os.environ.get("TELEGRAM_CHAT", "").strip()
              nalazi = [n for n in nalazi if n.jaki]
              if not token or not chat or not nalazi:
                  return
              ukupno = len(nalazi)
              nalazi = sorted(nalazi, key=lambda n: -n.pad)[:10]
              redovi = [f"🔎 Lovac na greške, {datum:%d. %m.}: {ukupno} mogućih grešaka"]
              for n in nalazi:
                  redovi.append(
                      f"\n−{n.pad:.0f}%  {n.artikl.naziv} {n.artikl.kolicina}".rstrip()
                      + f"\n{n.artikl.najniza:.2f} € (inače {n.usporedna:.2f} €)"
                      + f"\n{n.artikl.poslovnica}"
                  )
              url_stranice = os.environ.get("STRANICA_URL", "").strip()
              if url_stranice:
                  redovi.append(f"\n{url_stranice}")
              podaci = urllib.parse.urlencode({
                  "chat_id": chat, "text": "\n".join(redovi), "disable_web_page_preview": "true",
              }).encode()
              try:
                  with urllib.request.urlopen(
                      f"https://api.telegram.org/bot{token}/sendMessage", data=podaci, timeout=20
                  ) as r:
                      ok = json.loads(r.read().decode()).get("ok")
                  print("Telegram: poslano" if ok else "Telegram: nije poslano")
              except Exception as err:
                  print(f"Telegram: nije poslano ({err})")


          def dijagnostika(nalazi: list[Nalaz]) -> None:
              """Ispis u zapisnik: koliko nalaza daje koji signal, i najveći primjeri."""
              from collections import Counter
              brojac = Counter()
              for n in nalazi:
                  for dio in n.razlog.split(" · "):
                      brojac[dio.split(":")[0]] += 1
              print("    signali:", dict(brojac))
              for n in sorted([n for n in nalazi if n.jaki], key=lambda n: -n.pad)[:12]:
                  a = n.artikl
                  print(f"    DIAG −{n.pad:.0f}% | {a.naziv[:40]} | {a.kolicina} | sada {a.najniza} | "
                        f"medijan {a.medijan} ({a.broj_poslovnica} posl.) | sidrena {a.sidrena} | "
                        f"30d {a.najniza_30} | MPC {a.redovna} akc {a.akcijska} | {n.razlog[:80]}")


          # --------------------------------------------------------------------------
          # Glavni program
          # --------------------------------------------------------------------------

          def main(argv=None):
              ap = argparse.ArgumentParser(description="Lovac na greške u cijenama hrane")
              ap.add_argument("-c", "--lanci", default=ZADANI_LANCI)
              ap.add_argument("--grad", default=ZADANI_GRAD)
              ap.add_argument("--prag", type=float, default=ZADANI_PRAG)
              ap.add_argument("--samo", default="", help='npr. "kava,meso,protein"')
              ap.add_argument("-d", "--datum", default=None, help="YYYY-MM-DD (zadano danas)")
              ap.add_argument("--ne-otvaraj", action="store_true")
              args = ap.parse_args(argv)

              logging.basicConfig(level=logging.WARNING, format="%(message)s")
              datum = dt.date.fromisoformat(args.datum) if args.datum else dt.date.today()
              lanci = [l.strip().lower() for l in args.lanci.split(",") if l.strip()]
              rijeci = [bez_kvacica(r.strip()) for r in args.samo.split(",") if r.strip()]

              db = otvori_bazu()
              svi_nalazi, statusi = [], {}

              for lanac in lanci:
                  print(f"→ {lanac.title()}: skidam cjenike...", flush=True)
                  try:
                      poslovnice = prikupi(lanac, datum, args.grad)
                  except Exception as err:
                      print(f"  ✗ nije uspjelo: {err}")
                      statusi[lanac] = "nije uspjelo"
                      continue
                  if not poslovnice:
                      print("  ✗ nema poslovnica (krivi grad ili cjenik još nije objavljen)")
                      statusi[lanac] = "nema podataka"
                      continue

                  artikli = sazmi(poslovnice)
                  nalazi = pronadi_sumnjive(db, datum, lanac, artikli, args.prag, rijeci)
                  spremi_dan(db, datum, lanac, artikli)
                  spremi_nalaze(db, datum, lanac, nalazi)
                  svi_nalazi += nalazi
                  statusi[lanac] = f"{len(poslovnice)} poslovnica, {len(artikli)} artikala"
                  jaki = sum(n.jaki for n in nalazi)
                  print(f"  ✓ {len(poslovnice)} poslovnica, {len(artikli)} artikala, "
                        f"{jaki} mogućih grešaka, {len(nalazi) - jaki} rasprodaja")
                  dijagnostika(nalazi)

              putanja = napravi_izvjestaj(db, svi_nalazi, datum, statusi, args.prag, rijeci)
              print(f"\nIzvještaj: {putanja}")
              posalji_telegram(svi_nalazi, datum)
              if not args.ne_otvaraj:
                  webbrowser.open(putanja.as_uri())


          if __name__ == "__main__":
              sys.exit(main())
          LOVAC_EOF
          uv sync
          uv run lovac.py --ne-otvaraj -c "$LANCI" --grad "$GRAD" --prag "$PRAG" --samo "$SAMO"
          mkdir -p ../stranica
          cp izvjestaj.html ../stranica/index.html

      - name: Spremi povijest cijena
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crawler-projekt/lovac_cijene.sqlite
          key: lovac-povijest-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stranica

      - id: objava
        uses: actions/deploy-pages@v4
